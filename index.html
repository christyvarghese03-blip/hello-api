<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Page</title>
  <style>
    /* Reset & CSS Variables */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Layout & Styling */
    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      line-height: 1.6;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .profile-header {
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 500;
    }

    .divider {
      height: 1px;
      background: var(--card-border);
      margin: 1.5rem 0;
    }

    .bio {
      color: #cbd5e1;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--accent-glow);
      padding: 0.625rem 1rem;
      border-radius: 9999px;
      width: fit-content;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Small screens tweak */
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 1.875rem;
      }
      
      .subtitle {
        font-size: 0.975rem;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <header class="profile-header">
      <h1>Alex</h1>
      <p class="subtitle">MSc student, National College of Ireland</p>
    </header>

    <div class="divider"></div>

    <p class="bio">
      I am passionate about leveraging data analytics to optimize supply chain visibility and significantly reduce operational waste in modern enterprise logistics.
    </p>

    <footer class="footer">
      <span class="status-dot"></span>
      <span id="date-display"></span>
    </footer>
  </main>

  <script>
    // Format and display today's date
    const dateOptions = { 
      weekday: 'long', 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric' 
    };
    
    const today = new Date().toLocaleDateString('en-US', dateOptions);
    document.getElementById('date-display').textContent = today;
  </script>

</body>
</html>
